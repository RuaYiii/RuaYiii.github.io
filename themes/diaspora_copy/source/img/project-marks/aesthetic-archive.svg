<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260">
  <title>Aesthetic Archive — overlapping image frames</title>
  <!-- Keep the site's 10 / -5 / 9 degree rhythm and matching portrait proportions. -->
  <g fill="none" stroke-linejoin="miter">
    <g transform="rotate(10 78 105)">
      <rect x="24" y="32" width="108" height="146" stroke="#859180" stroke-width="6"/>
    </g>
    <g transform="rotate(9 158 143)">
      <rect x="104" y="70" width="108" height="146" stroke="#b66d52" stroke-width="5"/>
    </g>
    <!-- A uniform key frame preserves negative space without a heavy photo border. -->
    <g transform="rotate(-5 121 124)">
      <rect x="67" y="51" width="108" height="146" stroke="#343b32" stroke-width="8"/>
      <path d="M79 51H103" stroke="#c7ad72" stroke-width="8"/>
    </g>
  </g>
</svg>
